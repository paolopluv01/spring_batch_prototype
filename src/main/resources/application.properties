spring.application.name=assistance
# Permette a Hibernate di creare le tabelle basandosi sulle @Entity
spring.jpa.hibernate.ddl-auto=update

# Abilita la console web di H2
 # H2 console can be enabled via the management endpoints or IDE-specific settings.
 # Removed spring.h2.console.enabled because it's flagged as unknown in some setups.
# Use the standard H2 console path (include the dash). Some IDEs/language servers
# expect the conventional '/h2-console' path; keeping this form avoids warnings.
# The 'spring.h2.console.path' property can be reported as unknown in some setups
# (IDE/language-server validation). Remove or comment it if your environment
# flags it. The default console path is '/h2-console'.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostra le query SQL nei log (utile per studiare)
spring.jpa.show-sql=true

# Datasource properties for H2 (helps IDE recognize H2 console properties)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
